<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" role="img" aria-labelledby="plug-logo-title">
  <title id="plug-logo-title">DSH Market 插件版 Logo（黑灰剪影虎鲸插头，眼睛镂空）</title>
  <defs>
    <linearGradient id="plugLogoGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3E444D"/>
      <stop offset="1" stop-color="#17191D"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="118" height="118" rx="27" fill="#F4F6F8" stroke="#DFE4EA" stroke-width="2"/>
  <g transform="translate(60 62) scale(1.35) translate(-60 -62)">
    <!-- 小背鳍（圆润驼峰） -->
    <path d="M51 42 C52 36 56 32 61 32 C60 37 60 40 60 42 Z" fill="url(#plugLogoGrad)"/>
    <!-- 小分叉尾鳍 -->
    <path d="M83 62 C87 57 93 55 97 56 C94 59 91 61 88 62 C91 65 91 69 88 70 C90 66 87 63 83 62 Z" fill="url(#plugLogoGrad)"/>
    <!-- 插头主体 -->
    <g fill="url(#plugLogoGrad)">
      <path d="M38 42 h44 a6 6 0 0 1 6 6 v8 h-14 a8 8 0 1 0 -16 0 h-20 a6 6 0 0 1 -6 -6 v-2 a6 6 0 0 1 6 -6 z"/>
      <rect x="38" y="60" width="8" height="14" rx="4"/>
      <rect x="50" y="66" width="8" height="18" rx="4"/>
      <rect x="62" y="60" width="8" height="14" rx="4"/>
    </g>
    <!-- 眼睛（背景色镂空点） -->
    <circle cx="60" cy="46" r="2.8" fill="#F4F6F8"/>
  </g>
</svg>
