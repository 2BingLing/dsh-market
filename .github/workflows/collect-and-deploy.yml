name: collect-and-deploy

on:
  schedule:
    # 每天 UTC 22:00（北京时间 06:00）自动收录 + 发布
    - cron: "0 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  # 生态暴涨后全量 collect 需 30+ 分钟，旧 run 排队会堆积；新 run 直接取消旧 run
  cancel-in-progress: true

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm ci

      - name: 运行数据管道（扫描/检测/评分/中文化）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: npm run collect

      - name: 同步数据到 Web
        run: cp data/plugins.json web/public/plugins.json

      - name: 同步收录数量到 README（banner 为静态资产，本地维护，不每日重生成）
        run: node scripts/sync-count.mjs

      - name: 提交并推送数据更新
        run: |
          git config user.name "dsh-market-bot"
          git config user.email "dsh-market-bot@users.noreply.github.com"
          # data/ 在 .gitignore 中，用 -f 强制提交数据快照
          # issue-replies.json 只在有 issue 收录时生成，不加入 add 清单（reply 步骤读不到会优雅跳过）
          # banner 静态资产由本地 compose-banner.mjs 维护（Ubuntu runner 无中文字体会乱码），git add 保留以防本地更新后随数据提交
          git add -f data/plugins.json web/public/plugins.json assets/readme/hero.svg scripts/sync-count.mjs README.md README.en.md
          git commit -m "data: 每日自动收录更新" || echo "no data changes"
          git push

      - name: 自动回复提交插件 issue（已收录确认 + 徽章指引 + 关闭）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/reply-issues.mjs

      - name: 构建 Web
        run: npm run build -w web

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
