name: collect-and-deploy

on:
  schedule:
    # 每天 UTC 22:00（北京时间 06:00）自动收录 + 发布
    - cron: "0 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  # 生态暴涨后全量 collect 需 30+ 分钟，旧 run 排队会堆积；新 run 直接取消旧 run
  cancel-in-progress: true

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 恢复检测缓存（增量收集关键：roots/SKILL 内容缓存 + 标签别名）
        uses: actions/cache@v4
        with:
          path: |
            data/cache
            data/tag-alias.json
          key: detect-cache-${{ github.run_id }}
          restore-keys: detect-cache-

      - name: Install deps
        run: npm ci

      - name: 运行数据管道（扫描/检测/评分/中文化）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: npm run collect

      - name: 同步数据到 Web
        run: |
          cp data/plugins.json web/public/plugins.json
          # 整合包通道：只有启用扫描/手工生成后才同步（未生成则不部署该文件）
          test -f data/packs.json && cp data/packs.json web/public/packs.json || true

      - name: 同步收录数量到 README
        run: node scripts/sync-count.mjs

      - name: 提交并推送数据更新
        run: |
          git config user.name "dsh-market-bot"
          git config user.email "dsh-market-bot@users.noreply.github.com"
          # data/ 在 .gitignore 中，用 -f 强制提交数据快照
          # issue-replies.json 只在有 issue 收录时生成，不加入 add 清单（reply 步骤读不到会优雅跳过）
          # banner 为本地手动维护的静态资产（scripts/compose-banner.mjs 生成），workflow 不重生成
          # packs.json 由人工通道（scripts/pack-add.ts）维护，独立 add（不存在时跳过，避免拖垮整条 add）
          git add -f data/plugins.json data/zh-cache.json web/public/plugins.json assets/readme/hero.svg scripts/sync-count.mjs README.md README.en.md
          test -f data/packs.json && git add -f data/packs.json web/public/packs.json || true
          git commit -m "data: 每日自动收录更新" || echo "no data changes"
          git push

      - name: 自动回复提交插件 issue（已收录确认 + 徽章指引 + 关闭）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/reply-issues.mjs

      - name: 构建 Web
        run: npm run build -w web

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
