name: decay-scan

# 每周失效条目扫描（P0-D2）：仓库消失/归档/成 fork/长期停更 → 单跟踪 issue，只报不删。
# 扫描本身从不自动移除任何条目（处置由人工复核，见 scripts/decay-report-issue.mjs）。

on:
  schedule:
    # 周一 03:21 UTC（避开每日 collect 的 06:00 与整点）
    - cron: "21 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: decay-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    # 事故复盘（#1 run，2026-08-24）：5175 条扫了 32 分钟被取消，且烧光与每日 collect 共享的
    # secrets.GITHUB_TOKEN 配额导致 06:00 管道失败。本次修复：
    # ① 用 github.token（独立配额）→ 不再与 collect 抢额度（只读+issues 足够）
    # ② env DECAY_CONCURRENCY=5 降并发 + decay.ts 错误熔断（超预算提前终止出部分结果）
    # ③ decay-cli 每 200 条喂进度日志 → 不会零输出被误 cancel
    # ④ 超时 40 分钟兜底
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install deps
        run: npm ci

      - name: 运行失效扫描（写 data/decay-report.json）
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DECAY_CONCURRENCY: "5"
        run: node --use-env-proxy --import tsx collector/src/decay-cli.ts

      - name: 汇总到跟踪 issue（只报不删；全部健康则关闭）
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/decay-report-issue.mjs
